name: Go CI

on:
  push:
    branches: [ main, master, go-migration ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod tidy
      - run: gofmt -w main.go internal/api.go
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
